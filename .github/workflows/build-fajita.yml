name: Build Fajita Kernel (Enchilada Base)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Clone kernel only
        run: |
          git clone --depth 1 https://github.com/commaai/agnos-kernel-sdm845.git agnos-kernel-sdm845
          ls -la agnos-kernel-sdm845/

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev bison flex libelf-dev

      - name: Build kernel with enchilada_defconfig
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS="-w"
          cd agnos-kernel-sdm845
          make enchilada_defconfig O=out
          make -j$(nproc) O=out

      - name: Package Image.gz-dtb
        run: |
          mkdir -p output
          cp agnos-kernel-sdm845/out/arch/arm64/boot/Image.gz-dtb output/
          cp agnos-kernel-sdm845/out/drivers/staging/qcacld-3.0/wlan.ko output/ 2>/dev/null || true
          cp agnos-kernel-sdm845/out/techpack/audio/asoc/snd-soc-sdm845.ko output/ 2>/dev/null || true
          cp agnos-kernel-sdm845/out/techpack/audio/asoc/codecs/snd-soc-wcd9xxx.ko output/ 2>/dev/null || true
          ls -la output/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fajita-kernel-artifacts
          path: output/
          retention-days: 30
