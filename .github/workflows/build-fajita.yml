name: Build Fajita Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev bison flex libelf-dev libncurses5-dev python3 python2 make git

      - name: Clone AGNOS kernel
        run: git clone --depth 1 https://github.com/commaai/agnos-kernel-sdm845.git agnos-kernel-sdm845

      - name: Fetch fajita device tree
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/torvalds/linux.git linux-upstream
          cd linux-upstream
          git sparse-checkout init --cone
          git sparse-checkout set arch/arm64/boot/dts/qcom
          git checkout
          KERNEL_DIR=../agnos-kernel-sdm845/arch/arm64/boot/dts/qcom
          cp arch/arm64/boot/dts/qcom/sdm845-oneplus-fajita.dts "$KERNEL_DIR/"
          cp arch/arm64/boot/dts/qcom/sdm845-oneplus-common.dtsi "$KERNEL_DIR/"
          echo "=== Fajita files ==="
          ls -la "$KERNEL_DIR"/sdm845-oneplus*

      - name: Fix Python scripts
        run: |
          if [ -f "agnos-kernel-sdm845/scripts/gcc-wrapper.py" ]; then
            sed -i "s/print 'error, forbidden warning:',/print('error, forbidden warning:',/g" agnos-kernel-sdm845/scripts/gcc-wrapper.py
            sed -i "s/print 'warning:',/print('warning:',/g" agnos-kernel-sdm845/scripts/gcc-wrapper.py
            echo "Fixed gcc-wrapper.py"
          fi

      - name: Patch config
        run: |
          if [ -f "agnos-kernel-sdm845/arch/arm64/configs/sdm845_defconfig" ]; then
            sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/' agnos-kernel-sdm845/arch/arm64/configs/sdm845_defconfig
            sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' agnos-kernel-sdm845/arch/arm64/configs/sdm845_defconfig
          fi

      - name: Build kernel
        run: |
          cd agnos-kernel-sdm845
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error"
          make sdm845_defconfig O=out
          make -j$(nproc) O=out

      - name: Package
        run: |
          mkdir -p output
          cp agnos-kernel-sdm845/out/arch/arm64/boot/Image.gz-dtb output/
          find agnos-kernel-sdm845/out -name "*.ko" -exec cp {} output/ \; 2>/dev/null || true
          ls -la output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fajita-kernel
          path: output/
          retention-days: 30
