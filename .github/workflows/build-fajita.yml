name: Build Fajita Kernel

on:
  workflow_dispatch:
  push:
    branches: [oneplus6t, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build kernel
        run: |
          cd agnos-kernel-sdm845
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make fajita_defconfig O=out
          make -j$(nproc) O=out

      - name: Package Image.gz-dtb
        run: |
          mkdir -p output
          cp agnos-kernel-sdm845/out/arch/arm64/boot/Image.gz-dtb output/
          cp agnos-kernel-sdm845/out/drivers/staging/qcacld-3.0/wlan.ko output/ 2>/dev/null || true
          cp agnos-kernel-sdm845/out/techpack/audio/asoc/snd-soc-sdm845.ko output/ 2>/dev/null || true
          cp agnos-kernel-sdm845/out/techpack/audio/asoc/codecs/snd-soc-wcd9xxx.ko output/ 2>/dev/null || true

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fajita-kernel-artifacts
          path: output/
          retention-days: 30
